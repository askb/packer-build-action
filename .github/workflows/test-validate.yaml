name: Test Packer Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-validate:
    name: Test Validation Mode
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout packer-build-action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: action-repo

      - name: Checkout test repository with Packer templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lfit/releng-common-packer
          path: target-repo
          submodules: recursive

      # Regression cover for template discovery. A path containing
      # spaces used to split on IFS, turning one template into several
      # non-existent ones and failing validation. The fixture declares
      # only a variable, so it needs no plugins and adds no network
      # dependency. Placed using the same rule the validation script
      # applies when choosing which directory to search.
      - name: Add whitespace-path template fixture
        shell: bash
        working-directory: target-repo
        run: |
          # Add whitespace-path template fixture
          if [ -d packer ]; then
            search_dir='packer'
          else
            search_dir='.'
          fi
          mkdir -p "$search_dir/fixture templates"
          printf '%s\n' \
            'variable "whitespace_path_fixture" {' \
            '  type    = string' \
            '  default = "regression cover for template discovery"' \
            '}' \
            > "$search_dir/fixture templates/spaced name.pkr.hcl"
          echo "Fixture written under: $search_dir/fixture templates/"

      - name: Run Packer validation
        uses: ./action-repo
        with:
          mode: validate
          packer_working_dir: "."
          path_prefix: "target-repo"
          packer_version: "1.11.2"
          python_version: "3.11"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Test Results"
            echo "✅ Validation test completed"
          } >> "${GITHUB_STEP_SUMMARY}"
